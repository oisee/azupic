name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Build six platforms
        run: python3 scripts/build-release.py 0.1.0-ci
      - name: Verify checksums
        run: cd dist && sha256sum --check checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: azupic-six-platforms
          path: dist/
          if-no-files-found: error
